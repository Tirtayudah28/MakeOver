<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status Pembayaran · UMKMate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin: 0; padding: 0;
    }

    .sheet {
      width: 100%; max-width: 430px;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 32px 24px 40px;
      max-height: 93vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulseRing {
      0%   { transform: scale(1);   opacity: 0.5; }
      100% { transform: scale(1.9); opacity: 0;   }
    }
    @keyframes fillBar {
      from { width: 0%; }
      to   { width: 100%; }
    }
    @keyframes scaleIn {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    @keyframes checkDraw {
      from { stroke-dashoffset: 60; }
      to   { stroke-dashoffset: 0;  }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px);  }
      50%       { transform: translateY(-6px); }
    }

    .anim-sheet { animation: slideUp .38s cubic-bezier(0.32,0.72,0,1) forwards; }
    .anim-fade  { animation: fadeIn  .3s ease forwards; }
    .anim-scale { animation: scaleIn .4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .anim-float { animation: float 3s ease-in-out infinite; }
    .spinner    { animation: spin 1s linear infinite; }
    .pulse-ring { animation: pulseRing 1.6s ease-out infinite; }
    .check-path {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: checkDraw .5s ease .4s forwards;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    button:active { transform: scale(0.97); }

    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #111827; color: #fff; padding: 11px 22px;
      border-radius: 99px; font-size: 13px; font-weight: 600;
      z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .3s;
      white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,.25);
    }
    .toast.show { opacity: 1; }

    /* Step pill nav */
    .step-nav {
      display: flex; gap: 6px;
      margin-bottom: 24px;
    }
    .step-pill {
      flex: 1; padding: 8px 6px;
      border-radius: 12px; font-size: 11px; font-weight: 700;
      text-align: center; cursor: pointer;
      border: 1.5px solid #e5e7eb; color: #9ca3af;
      background: white; transition: all .18s;
      line-height: 1.3;
    }
    .step-pill.active {
      background: #111827; color: white; border-color: #111827;
    }
    .step-pill.done {
      background: #f0fdf4; color: #059669; border-color: #a7f3d0;
    }

    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 0; border-bottom: 1px solid #f9fafb;
    }
    .info-row:last-child { border-bottom: none; }

    /* Receipt tear line */
    .tear-line {
      position: relative; margin: 0 -24px;
      height: 24px; overflow: hidden;
    }
    .tear-line::before {
      content: '';
      position: absolute; top: 50%; left: 0; right: 0;
      border-top: 2px dashed #e5e7eb;
    }
    .tear-circle-l, .tear-circle-r {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; border-radius: 50%;
      background: #f1f5f9;
    }
    .tear-circle-l { left: -10px; }
    .tear-circle-r { right: -10px; }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="sheet no-scrollbar anim-sheet" id="main-sheet">

  <!-- Step nav -->
  <div class="step-nav" id="step-nav">
    <button class="step-pill" onclick="navigate('verifying')" id="pill-verifying">⏳<br>Verifikasi</button>
    <button class="step-pill" onclick="navigate('success')"   id="pill-success">✅<br>Berhasil</button>
  </div>

  <!-- Dynamic content -->
  <div id="content"></div>
</div>

<script>
const EVENT = {
  name:   'Street Food Carnival',
  date:   '5-7 Mei 2026',
  loc:    'GBK, Jakarta',
  fee:    '3.500.000',
  method: 'Transfer Bank BCA',
  trx:    'TRX-' + Math.random().toString(36).substring(2,10).toUpperCase(),
  booth:  'Warung Kopi Nusantara',
};

// ─── Toast ──────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── Hash Router ─────────────────────────────────────────
const STEPS = ['verifying', 'success'];

function getStepFromHash() {
  const h = window.location.hash.replace('#', '').toLowerCase();
  return STEPS.includes(h) ? h : 'verifying';
}

function navigate(step) {
  history.pushState(null, '', '#' + step);
  render(step);
}

function render(step) {
  if (!STEPS.includes(step)) step = 'verifying';

  // Update pills
  STEPS.forEach(s => {
    const p = document.getElementById('pill-' + s);
    if (!p) return;
    const idx = STEPS.indexOf(s);
    const cur = STEPS.indexOf(step);
    if (s === step) p.className = 'step-pill active';
    else if (idx < cur) p.className = 'step-pill done';
    else p.className = 'step-pill';
  });

  const content = document.getElementById('content');
  content.innerHTML = step === 'verifying' ? tplVerifying() : tplSuccess();
  content.className = 'anim-fade';

  // Auto-advance from verifying after 3s for demo
  if (step === 'verifying') {
    setTimeout(() => {
      if (getStepFromHash() === 'verifying') navigate('success');
    }, 3000);
  }
}

window.addEventListener('popstate', () => render(getStepFromHash()));

// ─── Template: Verifying ─────────────────────────────────
function tplVerifying() {
  return `
  <div class="flex flex-col items-center text-center py-6">

    <!-- Spinner with pulse rings -->
    <div class="relative w-28 h-28 mb-8">
      <div class="absolute inset-0 bg-emerald-200 rounded-full pulse-ring"></div>
      <div class="absolute inset-0 bg-emerald-100 rounded-full pulse-ring" style="animation-delay:.6s"></div>
      <div class="relative w-28 h-28 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-full flex items-center justify-center shadow-lg z-10">
        <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
      </div>
    </div>

    <h2 class="text-gray-900 font-extrabold text-2xl mb-2">Memverifikasi</h2>
    <p class="text-gray-500 text-sm leading-relaxed mb-8">Sistem kami sedang memeriksa<br>pembayaranmu secara otomatis...</p>

    <!-- Progress bar -->
    <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden mb-3">
      <div class="h-full bg-gradient-to-r from-emerald-400 to-teal-500 rounded-full"
           style="animation: fillBar 2.9s ease forwards; width:0%"></div>
    </div>
    <p class="text-gray-400 text-xs mb-10">Jangan tutup halaman ini</p>

    <!-- Transaction summary -->
    <div class="w-full bg-gray-50 rounded-2xl p-5 text-left">
      <p class="text-gray-400 text-xs font-bold mb-3 tracking-wider">DETAIL TRANSAKSI</p>
      <div class="space-y-2.5 text-sm">
        <div class="flex justify-between"><span class="text-gray-400">Event</span><span class="text-gray-700 font-semibold">${EVENT.name}</span></div>
        <div class="flex justify-between"><span class="text-gray-400">Booth</span><span class="text-gray-700 font-semibold">${EVENT.booth}</span></div>
        <div class="flex justify-between"><span class="text-gray-400">Metode</span><span class="text-gray-700 font-semibold">${EVENT.method}</span></div>
        <div class="flex justify-between items-center pt-1 border-t border-gray-200">
          <span class="text-gray-700 font-bold">Total</span>
          <span class="text-emerald-600 font-extrabold text-lg">Rp ${EVENT.fee}</span>
        </div>
      </div>
    </div>

    <p class="text-gray-400 text-xs mt-5">Biasanya selesai dalam <strong class="text-gray-600">10–30 detik</strong></p>
  </div>`;
}

// ─── Template: Success ───────────────────────────────────
function tplSuccess() {
  const now = new Date();
  const fmt = now.toLocaleString('id-ID', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });

  return `
  <div class="flex flex-col items-center">

    <!-- Check icon -->
    <div class="relative w-28 h-28 mb-6 anim-float">
      <div class="w-28 h-28 bg-emerald-100 rounded-full flex items-center justify-center anim-scale">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="32" fill="#d1fae5"/>
          <polyline class="check-path" points="16,32 27,43 48,22"
            fill="none" stroke="#10b981" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <p class="text-emerald-500 text-xs font-extrabold tracking-widest mb-1.5">PEMBAYARAN BERHASIL</p>
    <p class="text-gray-900 font-extrabold text-3xl mb-1">Rp ${EVENT.fee}</p>
    <p class="text-gray-400 text-sm mb-8">via ${EVENT.method}</p>

    <!-- Receipt card -->
    <div class="w-full border border-gray-200 rounded-3xl overflow-hidden mb-6 shadow-sm">

      <!-- Receipt header -->
      <div class="bg-gradient-to-r from-emerald-500 to-teal-500 px-5 py-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/>
              <rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
              <path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/>
              <path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/>
              <path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>
            </svg>
          </div>
          <div>
            <p class="text-white font-bold text-sm">Event Pass Aktif</p>
            <p class="text-emerald-100 text-xs">${EVENT.booth} · ${EVENT.date}</p>
          </div>
          <span class="ml-auto bg-white/25 text-white text-xs font-bold px-2.5 py-1 rounded-full">✓ AKTIF</span>
        </div>
      </div>

      <!-- Tear line -->
      <div class="tear-line">
        <div class="tear-circle-l"></div>
        <div class="tear-circle-r"></div>
      </div>

      <!-- Receipt body -->
      <div class="px-5 py-4">
        <div class="info-row">
          <span class="text-gray-400 text-xs">Event</span>
          <span class="text-gray-800 font-semibold text-sm">${EVENT.name}</span>
        </div>
        <div class="info-row">
          <span class="text-gray-400 text-xs">Tanggal</span>
          <span class="text-gray-800 font-semibold text-sm">${EVENT.date}</span>
        </div>
        <div class="info-row">
          <span class="text-gray-400 text-xs">Lokasi</span>
          <span class="text-gray-800 font-semibold text-sm">${EVENT.loc}</span>
        </div>
        <div class="info-row">
          <span class="text-gray-400 text-xs">No. Transaksi</span>
          <span class="text-gray-700 font-semibold text-xs">${EVENT.trx}</span>
        </div>
        <div class="info-row">
          <span class="text-gray-400 text-xs">Waktu</span>
          <span class="text-gray-700 font-semibold text-xs">${fmt}</span>
        </div>
        <div class="info-row">
          <span class="text-gray-400 text-xs">Metode</span>
          <span class="text-gray-700 font-semibold text-sm">${EVENT.method}</span>
        </div>
        <div class="info-row" style="border-bottom:none; padding-top:14px; border-top:2px dashed #f3f4f6; margin-top:4px;">
          <span class="text-gray-800 font-bold">Total Dibayar</span>
          <span class="text-emerald-600 font-extrabold text-xl">Rp ${EVENT.fee}</span>
        </div>
      </div>
    </div>

    <!-- Next steps -->
    <div class="w-full bg-gray-50 rounded-2xl p-5 mb-6">
      <p class="text-gray-600 text-xs font-bold mb-3 tracking-wider">LANGKAH SELANJUTNYA</p>
      <div class="space-y-3">
        ${[
          ['📲', 'Nomor booth dikirim via WhatsApp dalam 1×24 jam'],
          ['📦', 'Siapkan produk & perlengkapan boothmu'],
          ['🎟️', 'Download Event Pass dari menu Eventku saat sudah aktif'],
        ].map(([ic, tx]) => `
        <div class="flex items-start gap-3">
          <span class="text-base mt-0.5">${ic}</span>
          <p class="text-gray-500 text-xs leading-relaxed">${tx}</p>
        </div>`).join('')}
      </div>
    </div>

    <!-- CTA buttons -->
    <button onclick="showToast('Membuka Eventku...')" class="w-full py-4 bg-emerald-500 text-white rounded-2xl font-bold mb-3 flex items-center justify-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Lihat Eventku 🎉
    </button>
    <button onclick="shareReceipt()" class="w-full py-3.5 border-2 border-gray-200 rounded-2xl text-gray-600 font-semibold text-sm flex items-center justify-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Bagikan Bukti Pembayaran
    </button>

  </div>`;
}

function shareReceipt() {
  navigator.clipboard?.writeText(window.location.href).catch(() => {});
  showToast('Link disalin ke clipboard 🔗');
}

// ─── Init ────────────────────────────────────────────────
render(getStepFromHash());
</script>
</body>
</html>
