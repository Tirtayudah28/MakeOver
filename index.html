<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMKMate — Misi Selesai</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  background: #e8f5ee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Plus Jakarta Sans', sans-serif;
  padding: 24px;
}

/* ── CARD ── */
.card {
  width: 100%;
  max-width: 380px;
  border-radius: 28px;
  overflow: hidden;
  box-shadow:
    0 24px 64px rgba(30,120,70,0.22),
    0 4px 16px rgba(0,0,0,0.08);
  animation: cardPop 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
}

@keyframes cardPop {
  from { opacity:0; transform: scale(0.82) translateY(24px); }
  to   { opacity:1; transform: scale(1) translateY(0); }
}

/* ── TOP SECTION (green) ── */
.card-top {
  background: linear-gradient(160deg, #2ecc71 0%, #27ae60 60%, #1e9954 100%);
  padding: 32px 24px 28px;
  position: relative;
  text-align: center;
  overflow: hidden;
}

/* Decorative circles in bg */
.card-top::before {
  content: '';
  position: absolute;
  width: 220px; height: 220px;
  border-radius: 50%;
  border: 40px solid rgba(255,255,255,0.07);
  top: -60px; left: -50px;
}
.card-top::after {
  content: '';
  position: absolute;
  width: 160px; height: 160px;
  border-radius: 50%;
  border: 30px solid rgba(255,255,255,0.06);
  bottom: -50px; right: -30px;
}

/* Confetti dots */
.confetti-dot {
  position: absolute;
  border-radius: 50%;
  animation: confettiFall linear infinite;
  opacity: 0;
}
@keyframes confettiFall {
  0%   { opacity:0; transform: translateY(-10px) rotate(0deg); }
  10%  { opacity:1; }
  90%  { opacity:1; }
  100% { opacity:0; transform: translateY(120px) rotate(360deg); }
}

/* Close button */
.close-btn {
  position: absolute;
  top: 16px; right: 16px;
  width: 36px; height: 36px;
  border-radius: 12px;
  background: rgba(255,255,255,0.22);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-size: 16px;
  font-weight: 700;
  transition: background 0.2s, transform 0.15s;
  z-index: 2;
}
.close-btn:hover { background: rgba(255,255,255,0.35); transform: scale(1.08); }

/* Trophy circle */
.trophy-wrap {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 90px; height: 90px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  border: 3px solid rgba(255,255,255,0.3);
  margin-bottom: 18px;
  animation: trophyFloat 2.8s ease-in-out infinite;
  box-shadow: 0 0 0 8px rgba(255,255,255,0.07);
}
@keyframes trophyFloat {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(-6px); }
}

.trophy-icon { font-size: 42px; line-height: 1; }

/* Title */
.congrats-title {
  position: relative;
  z-index: 1;
  font-size: 1.75rem;
  font-weight: 800;
  color: white;
  letter-spacing: -0.01em;
  margin-bottom: 8px;
  animation: fadeUp 0.5s ease 0.2s both;
}
.congrats-emoji { margin-right: 4px; }

.congrats-sub {
  position: relative;
  z-index: 1;
  font-size: 0.92rem;
  font-weight: 500;
  color: rgba(255,255,255,0.85);
  line-height: 1.5;
  animation: fadeUp 0.5s ease 0.32s both;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}

/* XP badge */
.xp-badge {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.2);
  border: 1.5px solid rgba(255,255,255,0.35);
  border-radius: 999px;
  padding: 6px 16px;
  margin-top: 14px;
  font-size: 0.8rem;
  font-weight: 700;
  color: white;
  letter-spacing: 0.02em;
  animation: fadeUp 0.5s ease 0.44s both;
}
.xp-star { font-size: 14px; }

/* ── BOTTOM SECTION (white) ── */
.card-bottom {
  background: #ffffff;
  padding: 20px 22px 22px;
}

/* Mission info row */
.mission-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding-bottom: 16px;
  border-bottom: 1.5px solid #f0f0f0;
  margin-bottom: 16px;
  animation: fadeUp 0.5s ease 0.5s both;
}

.mission-icon-wrap {
  flex-shrink: 0;
  width: 54px; height: 54px;
  border-radius: 18px;
  background: linear-gradient(135deg, #2ecc71, #27ae60);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  box-shadow: 0 6px 16px rgba(39,174,96,0.3);
}

.mission-info { flex: 1; }
.mission-label {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 2px;
}
.mission-name {
  font-size: 1rem;
  font-weight: 800;
  color: #1a1a1a;
  line-height: 1.2;
}
.mission-status {
  font-size: 0.78rem;
  font-weight: 600;
  color: #2ecc71;
  margin-top: 2px;
}

/* Feature list */
.features-title {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #bbb;
  margin-bottom: 10px;
  animation: fadeUp 0.5s ease 0.58s both;
}

.features-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 20px;
  animation: fadeUp 0.5s ease 0.64s both;
}

.feature-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 12px;
  background: #f8fdf9;
  border: 1.5px solid #e8f5ee;
  border-radius: 14px;
  transition: border-color 0.2s, transform 0.15s;
  cursor: default;
}
.feature-item:hover {
  border-color: #2ecc71;
  transform: translateY(-1px);
}

.feature-emoji { font-size: 18px; flex-shrink: 0; }
.feature-name {
  font-size: 0.75rem;
  font-weight: 600;
  color: #333;
  line-height: 1.3;
}

/* Buttons */
.btn-primary {
  width: 100%;
  padding: 15px 20px;
  border-radius: 16px;
  background: linear-gradient(135deg, #2ecc71 0%, #1faa5a 100%);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  color: white;
  letter-spacing: 0.01em;
  box-shadow: 0 8px 24px rgba(39,174,96,0.35);
  transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  margin-bottom: 10px;
  animation: fadeUp 0.5s ease 0.72s both;
}
.btn-primary:hover { transform: scale(1.02); box-shadow: 0 12px 32px rgba(39,174,96,0.45); }
.btn-primary:active { transform: scale(0.98); }

.btn-secondary {
  width: 100%;
  padding: 14px 20px;
  border-radius: 16px;
  background: white;
  border: 2px solid #e5e5e5;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  color: #1a1a1a;
  transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  animation: fadeUp 0.5s ease 0.8s both;
}
.btn-secondary:hover { border-color: #2ecc71; color: #2ecc71; transform: scale(1.02); }
.btn-secondary:active { transform: scale(0.98); }

.btn-icon { font-size: 18px; }
</style>
</head>
<body>

<div class="card">

  <!-- ── TOP: Green celebration area ── -->
  <div class="card-top" id="cardTop">

    <!-- Confetti dots (injected by JS) -->

    <button class="close-btn" onclick="this.closest('.card').style.animation='cardPop 0.3s reverse forwards'">✕</button>

    <div class="trophy-wrap">
      <span class="trophy-icon">🏆</span>
    </div>

    <div class="congrats-title">
      <span class="congrats-emoji">🎉</span>Selamat!
    </div>
    <div class="congrats-sub">
      Misi pertamamu berhasil diselesaikan!<br>Kamu luar biasa 🌟
    </div>

    <div class="xp-badge">
      <span class="xp-star">⭐</span>
      +50 XP Diraih
    </div>

  </div>

  <!-- ── BOTTOM: White content area ── -->
  <div class="card-bottom">

    <!-- Mission info -->
    <div class="mission-row">
      <div class="mission-icon-wrap">👣</div>
      <div class="mission-info">
        <div class="mission-label">Misi Selesai</div>
        <div class="mission-name">Langkah Pertama</div>
        <div class="mission-status">✓ Bade Terbuka</div>
      </div>
    </div>

    <!-- Feature unlocked -->
    <div class="features-title">Fitur yang terbuka</div>
    <div class="features-grid">
      <div class="feature-item">
        <span class="feature-emoji">📊</span>
        <span class="feature-name">Ringkasan harian</span>
      </div>
      <div class="feature-item">
        <span class="feature-emoji">📈</span>
        <span class="feature-name">Laporan keuangan</span>
      </div>
      <div class="feature-item">
        <span class="feature-emoji">📷</span>
        <span class="feature-name">Scan struk</span>
      </div>
      <div class="feature-item">
        <span class="feature-emoji">🔄</span>
        <span class="feature-name">Sinkron bank</span>
      </div>
    </div>

    <!-- CTAs -->
    <button class="btn-primary">
      <span class="btn-icon">📊</span>
      Lihat Ringkasan Hari Ini
    </button>
    <button class="btn-secondary">
      <span class="btn-icon">⚡</span>
      Mulai Tantangan 7 Hari
    </button>

  </div>
</div>

<script>
// Generate confetti dots
const top = document.getElementById('cardTop');
const colors = ['#fff', '#ffd700', '#a8f0c8', '#ffe066', '#b5f5d5'];
for (let i = 0; i < 18; i++) {
  const d = document.createElement('div');
  d.className = 'confetti-dot';
  const size = Math.random() * 7 + 4;
  d.style.cssText = `
    width:${size}px; height:${size}px;
    background:${colors[Math.floor(Math.random()*colors.length)]};
    left:${Math.random()*100}%;
    top:${Math.random()*60}%;
    animation-duration:${Math.random()*2+2}s;
    animation-delay:${Math.random()*2}s;
    opacity:0;
  `;
  top.appendChild(d);
}
</script>
</body>
</html>
