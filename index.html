<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Event Pass · UMKMate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: rgba(0,0,0,0.7);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
    }

    .modal-box {
      background: white;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 382px;
      animation: scaleIn .25s ease forwards;
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    button:active { transform: scale(0.97); }

    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #1f2937; color: #fff; padding: 10px 20px;
      border-radius: 99px; font-size: 13px; font-weight: 600;
      z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .3s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="modal-box">
  <div class="text-center mb-4">
    <p class="text-gray-900 font-bold text-lg">Event Pass</p>
    <p class="text-gray-500 text-sm">Jakarta Food Festival 2026</p>
  </div>
  <div class="bg-gray-50 rounded-2xl p-6 flex flex-col items-center gap-3 mb-4">
    <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect width="5" height="5" x="3" y="3" rx="1"/>
      <rect width="5" height="5" x="16" y="3" rx="1"/>
      <rect width="5" height="5" x="3" y="16" rx="1"/>
      <path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
      <path d="M21 21v.01"/>
      <path d="M12 7v3a2 2 0 0 1-2 2H7"/>
      <path d="M3 12h.01"/>
      <path d="M12 3h.01"/>
      <path d="M12 16v.01"/>
      <path d="M16 12h1"/>
      <path d="M21 12v.01"/>
      <path d="M12 21v-1"/>
    </svg>
    <div class="text-center">
      <p class="text-gray-900 text-sm font-bold">Warung Kopi Nusantara</p>
      <p class="text-gray-500 text-xs">Booth B-125 · 25-27 Mar 2026</p>
    </div>
    <div class="bg-emerald-100 px-4 py-2 rounded-xl">
      <p class="text-emerald-700 text-xs font-bold">ID: JFF2026-B125-001</p>
    </div>
  </div>
  <button onclick="savePass()" class="w-full py-4 bg-emerald-500 text-white rounded-2xl font-bold">Simpan Event Pass</button>
</div>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function savePass() {
  showToast('Event pass disimpan ke galeri! 🎉');
}
</script>

</body>
</html>
