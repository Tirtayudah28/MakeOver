<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Tantangan 7 Hari</title>
  <!-- Tailwind + Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    .scale-tap:active { transform: scale(0.97); transition: transform 0.1s; }
    .no-tap-highlight { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">

<div class="w-full max-w-md mx-auto">
  <!-- Card Tantangan 7 Hari - Component -->
  <div id="challengeCard" class="bg-gradient-to-br from-purple-500 via-violet-600 to-indigo-700 rounded-3xl p-5 shadow-lg cursor-pointer overflow-hidden relative scale-tap no-tap-highlight">
    <!-- Decorative circles -->
    <div class="absolute -right-6 -top-6 w-24 h-24 bg-white/10 rounded-full"></div>
    <div class="absolute -right-2 -bottom-8 w-32 h-32 bg-white/5 rounded-full"></div>
    
    <!-- Content -->
    <div class="relative">
      <!-- Header -->
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center">
            <i data-lucide="trophy" class="w-4 h-4 text-white"></i>
          </div>
          <div>
            <p class="text-purple-200 text-xs font-semibold">#UMKMNAIKELAS</p>
            <p class="text-white text-sm font-bold">Misi Hari ke-1</p>
          </div>
        </div>
        <div class="text-right">
          <p class="text-purple-200 text-xs">Progress</p>
          <p class="text-white text-sm font-bold">0/7</p>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="h-2 bg-white/20 rounded-full overflow-hidden mb-3">
        <div class="h-full bg-white rounded-full" style="width: 0%"></div>
      </div>

      <!-- Today's mission -->
      <div class="rounded-2xl p-3 mb-3 bg-white/15">
        <p class="text-white text-xs mb-0.5 font-semibold">🎯 Misi Hari Ini</p>
        <p class="text-white text-sm font-medium">Catat 3 transaksi hari ini</p>
      </div>

      <!-- Stats & Arrow -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <!-- Streak -->
          <div class="flex items-center gap-1 bg-white/15 rounded-full px-3 py-1.5">
            <i data-lucide="flame" class="w-3.5 h-3.5 text-orange-300"></i>
            <span class="text-white text-xs font-semibold">Streak: 0 hari</span>
          </div>
          <!-- Grace day -->
          <div class="flex items-center gap-1 bg-white/15 rounded-full px-3 py-1.5">
            <i data-lucide="shield" class="w-3.5 h-3.5 text-blue-300"></i>
            <span class="text-white text-xs font-semibold">Grace: 1x</span>
          </div>
        </div>
        <!-- Arrow right -->
        <div class="w-8 h-8 bg-white/20 rounded-xl flex items-center justify-center">
          <i data-lucide="chevron-right" class="w-4 h-4 text-white"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Keterangan / Catatan Kecil -->
  <p class="text-xs text-gray-500 text-center mt-6">
    Card Tantangan 7 Hari - Desain siap pakai
  </p>
</div>

<script>
  // Inisialisasi icon lucide
  lucide.createIcons();

  // Optional: Tambahkan event klik untuk preview
  document.getElementById('challengeCard')?.addEventListener('click', () => {
    alert('Card diklik! (Navigasi ke halaman detail misi)');
  });
</script>

</body>
</html>
