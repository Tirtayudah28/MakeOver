<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pendaftaran Event · UMKMate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    /* Container untuk preview - dipertahankan minimal, namun TANPA tombol pemicu */
    .demo-container {
      max-width: 430px;
      margin: 0 auto;
      background: #f9fafb;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: flex-end;
    }
    
    /* Modal styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
      max-width: 430px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
    }
    
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    
    .anim-slide-up {
      animation: slideUp .3s cubic-bezier(0.32,0.72,0,1) forwards;
    }
    
    button:active { transform: scale(0.97); }
    textarea:focus, input:focus, select:focus { border-color: #10b981 !important; outline: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    select { appearance: none; }
    
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #1f2937; color: #fff; padding: 10px 20px;
      border-radius: 99px; font-size: 13px; font-weight: 600;
      z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .3s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* Hilangkan tombol yang ada di container demo */
    .demo-container button {
      display: none;
    }
  </style>
</head>
<body>

<!-- Toast (tetap ada untuk feedback) -->
<div id="toast" class="toast"></div>

<!-- Demo container: HANYA sebagai latar/ruang kosong, tombol di dalamnya sudah disembunyikan via CSS -->
<div class="demo-container">
  <!-- Tombol sengaja disembunyikan dengan CSS .demo-container button { display:none; } -->
  <button style="display:none;">Tersembunyi</button>
</div>

<!-- ═══════════════════ MODAL REGISTRASI (DESAIN MURNI) LANGSUNG TAMPIL ═══════════════════ -->
<div id="register-modal" class="modal-overlay" onclick="closeRegisterModal()">
  <div class="bg-white rounded-t-3xl w-full p-6 no-scrollbar anim-slide-up" style="max-height:90vh;overflow-y:auto" onclick="event.stopPropagation()">

    <div class="flex items-center justify-between mb-5">
      <div>
        <p class="text-gray-500 text-xs font-semibold">PENDAFTARAN</p>
        <h3 id="modal-event-name" class="text-gray-900 font-bold text-lg">Street Food Carnival</h3>
      </div>
      <button onclick="closeRegisterModal()" class="w-9 h-9 bg-gray-100 rounded-xl flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Step progress -->
    <div class="flex gap-1.5 mb-5" id="step-bars">
      <div class="h-1.5 flex-1 rounded-full bg-emerald-500"></div>
      <div class="h-1.5 flex-1 rounded-full bg-gray-200"></div>
      <div class="h-1.5 flex-1 rounded-full bg-gray-200"></div>
      <div class="h-1.5 flex-1 rounded-full bg-gray-200"></div>
    </div>

    <!-- Step content -->
    <div id="reg-step-content"></div>

    <!-- Buttons -->
    <div class="flex gap-3 mt-5">
      <button id="reg-back-btn" onclick="regPrev()" class="hidden w-12 h-12 border-2 border-gray-200 rounded-xl flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button id="reg-next-btn" onclick="regNext()" class="flex-1 py-4 bg-emerald-500 text-white rounded-2xl font-bold flex items-center justify-center gap-2">
        Lanjut
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
// ── Data Events ──────────────────────────────────────────────────────────
const EVENTS = {
  'street-food': { 
    name: 'Street Food Carnival', 
    date: '5-7 Mei 2026', 
    location: 'GBK, Jakarta', 
    fee: 'Rp 3.5 juta', 
    deadline: '15 April 2026' 
  },
  'artisan': { 
    name: 'Artisan Market Kemang', 
    date: '28-30 April 2026', 
    location: 'Kemang Village, Jakarta', 
    fee: 'Rp 1.5 juta', 
    deadline: '20 April 2026' 
  },
  'digital': { 
    name: 'UMKM Digital Expo', 
    date: '15-17 Mei 2026', 
    location: 'ICE BSD, Tangerang', 
    fee: 'Rp 2.0 juta', 
    deadline: '5 Mei 2026' 
  },
};

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Modal State ──────────────────────────────────────────────────────────
let regStep = 0;
let currentEvent = EVENTS['street-food']; // Default event

const stepContent = [
  // Step 0: Info Booth
  (ev) => `
    <div class="space-y-4">
      <div class="bg-gray-50 rounded-2xl p-4">
        <div class="space-y-2 text-sm">
          ${[
            ['Event', ev.name],
            ['Tanggal', ev.date],
            ['Lokasi', ev.location],
            ['Biaya', ev.fee],
            ['Deadline', ev.deadline]
          ].map(([l,v]) => `
            <div class="flex justify-between">
              <span class="text-gray-500">${l}</span>
              <span class="text-gray-900 font-semibold">${v}</span>
            </div>
          `).join('')}
        </div>
      </div>
      
      <div>
        <label class="text-xs text-gray-500 mb-2 block font-semibold">Nama Brand / Toko</label>
        <input value="Warung Kopi Nusantara" class="w-full px-4 py-3.5 border-2 border-gray-200 rounded-2xl text-sm" />
      </div>
      
      <div>
        <label class="text-xs text-gray-500 mb-2 block font-semibold">Kategori Produk</label>
        <select class="w-full px-4 py-3.5 border-2 border-gray-200 rounded-2xl text-sm bg-white">
          <option>Minuman Kopi</option>
          <option>Makanan Ringan</option>
          <option>Makanan Berat</option>
          <option>Kerajinan Tangan</option>
          <option>Fashion</option>
        </select>
      </div>
    </div>`,

  // Step 1: Upload Produk
  () => `
    <div class="space-y-4">
      <p class="text-gray-500 text-sm">Upload foto produk yang akan dijual di booth</p>
      
      <div class="border-2 border-dashed border-gray-200 rounded-2xl p-8 flex flex-col items-center gap-3 bg-gray-50">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p class="text-gray-500 text-sm">Upload foto produk</p>
        <p class="text-gray-400 text-xs">JPG, PNG, maks 5MB per foto</p>
        <button onclick="showToast('Fitur upload akan segera hadir!')" class="px-4 py-2 bg-emerald-100 text-emerald-600 rounded-xl text-sm font-semibold">
          Pilih File
        </button>
      </div>
      
      <div>
        <label class="text-xs text-gray-500 mb-2 block font-semibold">Deskripsi Produk</label>
        <textarea placeholder="Ceritakan produk unggulanmu..." class="w-full px-4 py-3.5 border-2 border-gray-200 rounded-2xl text-sm" rows="3"></textarea>
      </div>
    </div>`,

  // Step 2: Bayar
  (ev) => `
    <div class="space-y-4">
      <div class="bg-gray-50 rounded-2xl p-4">
        <p class="text-gray-500 text-xs font-semibold mb-3">RINGKASAN PEMBAYARAN</p>
        <div class="space-y-2 text-sm">
          <div class="flex justify-between">
            <span class="text-gray-500">Biaya pendaftaran</span>
            <span class="text-gray-900 font-semibold">${ev.fee}</span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500">Pajak</span>
            <span class="text-gray-900 font-semibold">Rp 0</span>
          </div>
          <div class="border-t border-gray-200 pt-2 flex justify-between">
            <span class="text-gray-900 font-semibold">Total</span>
            <span class="text-emerald-600 font-bold">${ev.fee}</span>
          </div>
        </div>
      </div>
      
      <div>
        <p class="text-gray-500 text-xs font-semibold mb-3">METODE PEMBAYARAN</p>
        ${['Transfer Bank BCA', 'GoPay', 'OVO', 'QRIS'].map((m, i) => `
          <div onclick="selectPayment(this)" class="flex items-center gap-3 p-3 mb-2 rounded-xl border-2 cursor-pointer ${i === 0 ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200'}">
            <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${i === 0 ? 'border-emerald-500 bg-emerald-500' : 'border-gray-300'}">
              ${i === 0 ? '<div class="w-2 h-2 bg-white rounded-full"></div>' : ''}
            </div>
            <span class="text-sm ${i === 0 ? 'text-emerald-700 font-semibold' : 'text-gray-600'}">${m}</span>
          </div>
        `).join('')}
      </div>
    </div>`,

  // Step 3: Selesai
  (ev) => `
    <div class="text-center py-6">
      <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <h3 class="text-gray-900 font-bold text-xl mb-2">Pendaftaran Berhasil!</h3>
      <p class="text-gray-500 text-sm mb-4">Kamu sudah terdaftar di ${ev.name}. Event pass akan segera dikirim.</p>
      
      <div class="bg-gray-50 rounded-2xl p-5 border-2 border-dashed border-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-2">
          <rect width="5" height="5" x="3" y="3" rx="1"/>
          <rect width="5" height="5" x="16" y="3" rx="1"/>
          <rect width="5" height="5" x="3" y="16" rx="1"/>
          <path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
          <path d="M21 21v.01"/>
          <path d="M12 7v3a2 2 0 0 1-2 2H7"/>
          <path d="M3 12h.01"/>
          <path d="M12 3h.01"/>
          <path d="M12 16v.01"/>
          <path d="M16 12h1"/>
          <path d="M21 12v.01"/>
          <path d="M12 21v-1"/>
        </svg>
        <p class="text-gray-500 text-xs">Event Pass akan tersedia setelah pembayaran dikonfirmasi</p>
      </div>
    </div>`,
];

// ── Modal Functions ──────────────────────────────────────────────────────
function openRegisterModal(eventKey = 'street-food') {
  currentEvent = EVENTS[eventKey] || EVENTS['street-food'];
  document.getElementById('modal-event-name').textContent = currentEvent.name;
  regStep = 0;
  updateRegModal();
  
  const modal = document.getElementById('register-modal');
  modal.classList.remove('hidden');
  
  // Trigger animation
  const content = modal.querySelector('.bg-white');
  content.classList.remove('anim-slide-up');
  void content.offsetWidth;
  content.classList.add('anim-slide-up');
}

function closeRegisterModal() {
  document.getElementById('register-modal').classList.add('hidden');
}

function updateRegModal() {
  // Update step bars
  document.querySelectorAll('#step-bars div').forEach((b, i) => {
    b.className = 'h-1.5 flex-1 rounded-full ' + (i <= regStep ? 'bg-emerald-500' : 'bg-gray-200');
  });

  // Update content
  document.getElementById('reg-step-content').innerHTML = stepContent[regStep](currentEvent);

  // Update back button visibility
  document.getElementById('reg-back-btn').classList.toggle('hidden', regStep === 0 || regStep === 3);

  // Update next button label
  const nextBtn = document.getElementById('reg-next-btn');
  const labels = ['Lanjut', 'Lanjut', 'Bayar Sekarang', 'Selesai'];
  const showArrow = regStep < 3;
  
  nextBtn.innerHTML = labels[regStep] + (showArrow
    ? `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
       </svg>`
    : '');
}

function regNext() {
  if (regStep < 3) {
    regStep++;
    updateRegModal();
  } else {
    // Step selesai
    closeRegisterModal();
    showToast('Pendaftaran bazaar berhasil! 🎉');
    // Reset ke step 0 untuk next time
    regStep = 0;
  }
}

function regPrev() {
  if (regStep > 0) {
    regStep--;
    updateRegModal();
  }
}

function selectPayment(el) {
  // Reset semua
  document.querySelectorAll('#reg-step-content [onclick="selectPayment(this)"]').forEach(item => {
    item.className = 'flex items-center gap-3 p-3 mb-2 rounded-xl border-2 cursor-pointer border-gray-200';
    const circle = item.querySelector('.rounded-full');
    if (circle) {
      circle.className = 'w-5 h-5 rounded-full border-2 flex items-center justify-center border-gray-300';
      circle.innerHTML = '';
    }
    const span = item.querySelector('span');
    if (span) span.className = 'text-sm text-gray-600';
  });
  
  // Set yang dipilih
  el.className = 'flex items-center gap-3 p-3 mb-2 rounded-xl border-2 cursor-pointer border-emerald-500 bg-emerald-50';
  const circle = el.querySelector('.rounded-full');
  if (circle) {
    circle.className = 'w-5 h-5 rounded-full border-2 flex items-center justify-center border-emerald-500 bg-emerald-500';
    circle.innerHTML = '<div class="w-2 h-2 bg-white rounded-full"></div>';
  }
  const span = el.querySelector('span');
  if (span) span.className = 'text-sm text-emerald-700 font-semibold';
}

// ── TAMPILKAN MODAL LANGSUNG SETELAH HALAMAN DIMUAT ─────────────────────
window.addEventListener('load', function() {
  // Pastikan modal dalam keadaan siap, lalu buka dengan event default (street-food)
  openRegisterModal('street-food');
});
</script>

<!-- Optional: Contoh tombol kecil untuk membuka modal dengan event berbeda -->
<!-- Bisa dihapus jika tidak diperlukan. TAPI di sini tetap saya beri agar kamu bisa ganti-ganti event -->
<div style="max-width:430px; margin:20px auto; padding:0 20px; display:flex; gap:10px; flex-wrap:wrap;">
  <button onclick="openRegisterModal('street-food')" class="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-xl text-sm">Street Food</button>
  <button onclick="openRegisterModal('artisan')" class="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-xl text-sm">Artisan Market</button>
  <button onclick="openRegisterModal('digital')" class="px-4 py-2 bg-emerald-100 text-emerald-700 rounded-xl text-sm">Digital Expo</button>
  <p class="text-xs text-gray-500 mt-4">Klik tombol di atas untuk buka modal dengan data event berbeda (jika diperlukan)</p>
</div>

</body>
</html>
