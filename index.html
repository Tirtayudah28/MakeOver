<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manajemen Stok · Inventory</title>
  <!-- Font & Icons (Lucide via CDN + fallback) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <!-- Lucide icons (standalone) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Motion (Framer Motion) via ESM + custom element / using simple WAAPI fallback? We'll use mini gsap? But keep it simple: use pure CSS transitions + micro interactions, but we preserve tap scale & AnimatePresence style. We'll simulate with class toggles and simple timeouts. -->
  <style>
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .min-h-screen { background-color: #f9fafb; } /* gray-50 */
    .shadow-soft { box-shadow: 0 2px 8px rgba(0,0,0,0.02), 0 1px 4px rgba(0,0,0,0.02); }
    .scale-tap:active { transform: scale(0.97); transition: transform 0.1s; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    /* slide up animation for modal */
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes slideDown {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .animate-fade-in { animation: fadeIn 0.2s ease forwards; }
    .animate-fade-out { animation: fadeOut 0.2s ease forwards; }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .animate-slide-down { animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .backdrop-blur-sm { backdrop-filter: blur(4px); }
    .no-tap-highlight { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-50 flex justify-center items-start min-h-screen">

<!-- App container (max width mobile) -->
<div id="app" class="w-full max-w-md mx-auto bg-gray-50 relative min-h-screen shadow-soft"></div>

<!-- Toast container (sonner style) -->
<div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-xs px-4 pointer-events-none"></div>

<script>
  (function(){
    // ----- DATA (from original) -----
    const inventoryItems = [
      { id: 1, name: "Kopi Arabica Premium", category: "Bahan Baku", stock: 45, unit: "kg", minStock: 20, price: 85000, status: "good", supplier: "CV Kopi Nusantara" },
      { id: 2, name: "Gula Pasir", category: "Bahan Baku", stock: 12, unit: "kg", minStock: 15, price: 15000, status: "low", supplier: "Toko Berkah Jaya" },
      { id: 3, name: "Kemasan Paper Cup", category: "Kemasan", stock: 350, unit: "pcs", minStock: 100, price: 1500, status: "good", supplier: "PT Kemasan Modern" },
      { id: 4, name: "Susu UHT", category: "Bahan Baku", stock: 5, unit: "liter", minStock: 10, price: 18000, status: "critical", supplier: "Toko Berkah Jaya" },
      { id: 5, name: "Sedotan Ramah Lingkungan", category: "Kemasan", stock: 280, unit: "pcs", minStock: 150, price: 500, status: "good", supplier: "PT Kemasan Modern" },
      { id: 6, name: "Sirup Vanilla", category: "Bahan Baku", stock: 3, unit: "botol", minStock: 5, price: 35000, status: "critical", supplier: "Toko Berkah Jaya" },
    ];

    const suppliers = [
      { id: 1, name: "CV Kopi Nusantara", category: "Supplier Kopi", items: 3, contact: "0812-1111-2222", rating: 4.9 },
      { id: 2, name: "Toko Berkah Jaya", category: "Kebutuhan Umum", items: 5, contact: "0813-3333-4444", rating: 4.6 },
      { id: 3, name: "PT Kemasan Modern", category: "Kemasan & Packaging", items: 2, contact: "021-5678-9012", rating: 4.8 },
    ];

    const aiRecommendations = [
      { id: 1, item: "Susu UHT", reason: "Stok tinggal 5 liter, habis dalam ~2 hari", urgency: "critical", suggestQty: 20, unit: "liter", estimatedCost: 360000 },
      { id: 2, item: "Gula Pasir", reason: "Stok di bawah minimum, tren penjualan tinggi", urgency: "high", suggestQty: 25, unit: "kg", estimatedCost: 375000 },
      { id: 3, item: "Sirup Vanilla", reason: "Stok habis dalam estimasi 1 hari", urgency: "critical", suggestQty: 6, unit: "botol", estimatedCost: 210000 },
    ];

    // ----- simple toast (sonner style) -----
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toastEl = document.createElement('div');
      toastEl.className = `bg-white border border-gray-200 shadow-lg rounded-xl px-4 py-3 text-sm font-medium text-gray-800 transform transition-all duration-300 flex items-center gap-2 mb-2 animate-fade-in`;
      toastEl.innerHTML = `${type === 'success' ? '<span class="w-5 h-5 bg-emerald-500 rounded-full flex items-center justify-center text-white text-xs">✓</span>' : ''} ${message}`;
      container.appendChild(toastEl);
      setTimeout(() => {
        toastEl.classList.add('opacity-0', 'translate-y-[-10px]');
        setTimeout(() => toastEl.remove(), 200);
      }, 2500);
    }

    // ---- state management - vanilla ----
    const state = {
      activeTab: 'ai', // 'items' | 'suppliers' | 'ai'
      search: '',
      showAddItem: false,
      lowStockCount: inventoryItems.filter(i => i.status === 'low' || i.status === 'critical').length,
      criticalCount: inventoryItems.filter(i => i.status === 'critical').length,
      totalValue: inventoryItems.reduce((s, i) => s + i.stock * i.price, 0),
      filteredItems: () => inventoryItems.filter(i => 
        i.name.toLowerCase().includes(state.search.toLowerCase()) ||
        i.category.toLowerCase().includes(state.search.toLowerCase())
      ),
    };

    // helper status style
    function getStatusConfig(status) {
      if (status === "critical") return { bg: "bg-red-100", icon: "text-red-600", badge: "bg-red-100 text-red-700", label: "Kritis" };
      if (status === "low") return { bg: "bg-orange-100", icon: "text-orange-600", badge: "bg-orange-100 text-orange-700", label: "Rendah" };
      return { bg: "bg-emerald-100", icon: "text-emerald-600", badge: "bg-emerald-100 text-emerald-700", label: "Aman" };
    }

    // ----- render function (full ui rebuild) -----
    const appEl = document.getElementById('app');

    function render() {
      const filtered = state.filteredItems();
      const lowStockCount = inventoryItems.filter(i => i.status === 'low' || i.status === 'critical').length;
      const criticalCount = inventoryItems.filter(i => i.status === 'critical').length;
      const totalValue = inventoryItems.reduce((s, i) => s + i.stock * i.price, 0);

      // template literal for entire UI
      appEl.innerHTML = `
        <div class="min-h-screen bg-gray-50">
          <!-- Header fixed -->
          <div class="bg-white px-4 pt-6 pb-0 sticky top-0 z-10 shadow-sm">
            <div class="flex items-center gap-3 mb-4">
              <button id="backButton" class="p-2 hover:bg-gray-100 rounded-xl no-tap-highlight scale-tap">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
              </button>
              <div class="flex-1">
                <h1 class="text-gray-900 text-xl font-bold">Manajemen Stok</h1>
              </div>
              <button id="addItemButton" class="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center scale-tap">
                <i data-lucide="plus" class="w-5 h-5 text-white"></i>
              </button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-3 gap-2 mb-4">
              <div class="bg-emerald-50 rounded-2xl p-3 border border-emerald-100">
                <p class="text-emerald-600 text-xs mb-0.5">Total Nilai</p>
                <p class="text-emerald-900 font-bold text-[15px]">Rp ${(totalValue / 1000000).toFixed(1)}jt</p>
              </div>
              <div class="rounded-2xl p-3 border ${lowStockCount > 0 ? 'bg-orange-50 border-orange-100' : 'bg-gray-50 border-gray-100'}">
                <p class="text-xs mb-0.5 ${lowStockCount > 0 ? 'text-orange-600' : 'text-gray-500'}">Stok Rendah</p>
                <p class="font-bold text-[15px] ${lowStockCount > 0 ? 'text-orange-900' : 'text-gray-900'}">${lowStockCount} item</p>
              </div>
              <div class="rounded-2xl p-3 border ${criticalCount > 0 ? 'bg-red-50 border-red-100' : 'bg-gray-50 border-gray-100'}">
                <p class="text-xs mb-0.5 ${criticalCount > 0 ? 'text-red-600' : 'text-gray-500'}">Kritis</p>
                <p class="font-bold text-[15px] ${criticalCount > 0 ? 'text-red-900' : 'text-gray-900'}">${criticalCount} item</p>
              </div>
            </div>

            <!-- Tabs -->
            <div class="flex gap-0 border-b border-gray-100">
              <button data-tab="items" class="tab-btn flex-1 py-2.5 text-xs transition-colors border-b-2 ${state.activeTab === 'items' ? 'border-emerald-500 text-emerald-600 font-semibold' : 'border-transparent text-gray-400'}">Stok Barang</button>
              <button data-tab="suppliers" class="tab-btn flex-1 py-2.5 text-xs transition-colors border-b-2 ${state.activeTab === 'suppliers' ? 'border-emerald-500 text-emerald-600 font-semibold' : 'border-transparent text-gray-400'}">Supplier</button>
              <button data-tab="ai" class="tab-btn flex-1 py-2.5 text-xs transition-colors border-b-2 ${state.activeTab === 'ai' ? 'border-emerald-500 text-emerald-600 font-semibold' : 'border-transparent text-gray-400'}">AI Saran 🤖</button>
            </div>
          </div>

          <!-- Content area with dynamic tab -->
          <div id="tabContent" class="px-4 py-4 transition-opacity duration-200">
            ${renderTabContent(state.activeTab, filtered, lowStockCount)}
          </div>

          <!-- Add item modal (conditional) -->
          ${state.showAddItem ? `
            <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-50 max-w-md mx-auto flex items-end animate-fade-in">
              <div class="bg-white rounded-t-3xl w-full p-6 animate-slide-up">
                <div class="flex items-center justify-between mb-5">
                  <h3 class="text-gray-900 font-bold text-lg">Tambah Barang</h3>
                  <button id="closeModalBtn" class="w-8 h-8 bg-gray-100 rounded-xl flex items-center justify-center">
                    <i data-lucide="x" class="w-4 h-4"></i>
                  </button>
                </div>
                <div class="space-y-3 mb-5">
                  <input placeholder="Nama barang" class="w-full px-4 py-3.5 border-2 border-gray-200 rounded-2xl outline-none focus:border-emerald-500 text-sm" />
                  <div class="grid grid-cols-2 gap-3">
                    <input placeholder="Jumlah stok" type="number" class="px-4 py-3.5 border-2 border-gray-200 rounded-2xl outline-none focus:border-emerald-500 text-sm" />
                    <input placeholder="Satuan (kg, pcs...)" class="px-4 py-3.5 border-2 border-gray-200 rounded-2xl outline-none focus:border-emerald-500 text-sm" />
                  </div>
                  <input placeholder="Harga per satuan (Rp)" type="number" class="w-full px-4 py-3.5 border-2 border-gray-200 rounded-2xl outline-none focus:border-emerald-500 text-sm" />
                  <input placeholder="Minimum stok" type="number" class="w-full px-4 py-3.5 border-2 border-gray-200 rounded-2xl outline-none focus:border-emerald-500 text-sm" />
                </div>
                <button id="saveItemBtn" class="w-full py-4 bg-emerald-500 text-white rounded-2xl font-bold scale-tap">
                  Simpan Barang
                </button>
              </div>
            </div>
          ` : ''}
        </div>
      `;

      // replace icons
      lucide.createIcons();

      // attach event listeners after render
      attachEvents();
    }

    function renderTabContent(tab, filtered, lowStockCount) {
      if (tab === 'items') {
        return `
          <!-- Search -->
          <div class="flex gap-2 mb-4">
            <div class="flex-1 flex items-center gap-2 bg-white rounded-2xl px-4 py-3 border border-gray-200">
              <i data-lucide="search" class="w-4 h-4 text-gray-400"></i>
              <input type="text" id="searchInput" placeholder="Cari barang..." value="${state.search}" class="flex-1 outline-none text-sm bg-transparent" />
            </div>
            <button class="bg-white p-3 rounded-2xl border border-gray-200">
              <i data-lucide="filter" class="w-5 h-5 text-gray-600"></i>
            </button>
          </div>

          ${lowStockCount > 0 ? `
          <div class="bg-orange-50 rounded-2xl p-4 mb-4 border border-orange-200 flex items-center gap-3 animate-fade-in">
            <i data-lucide="alert-triangle" class="w-5 h-5 text-orange-600 flex-shrink-0"></i>
            <div class="flex-1">
              <p class="text-orange-900 text-sm font-semibold">Peringatan Stok!</p>
              <p class="text-orange-700 text-xs">${lowStockCount} item perlu segera direstok</p>
            </div>
            <button id="gotoAiTab" class="px-3 py-1.5 bg-orange-500 text-white text-xs rounded-lg font-semibold">Lihat Saran</button>
          </div>
          ` : ''}

          <!-- Items list -->
          <div class="space-y-3">
            ${filtered.map(item => {
              const config = getStatusConfig(item.status);
              const stockPct = Math.min((item.stock / (item.minStock * 2)) * 100, 100);
              return `
              <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 scale-tap cursor-pointer" data-item-id="${item.id}">
                <div class="flex items-start gap-3">
                  <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0 ${config.bg}">
                    <i data-lucide="package" class="w-5 h-5 ${config.icon}"></i>
                  </div>
                  <div class="flex-1">
                    <div class="flex items-start justify-between mb-1">
                      <div>
                        <p class="text-gray-900 text-sm font-semibold">${item.name}</p>
                        <p class="text-gray-500 text-xs">${item.category} · ${item.supplier}</p>
                      </div>
                      ${item.status !== "good" ? `<div class="px-2.5 py-1 rounded-full text-xs font-semibold ${config.badge}">${config.label}</div>` : ''}
                    </div>
                    <div class="flex items-center justify-between mb-2">
                      <p class="text-xs text-gray-600">
                        Stok: <span class="${config.icon} font-bold">${item.stock} ${item.unit}</span>
                        <span class="text-gray-400"> / min ${item.minStock}</span>
                      </p>
                      <p class="text-xs text-gray-700 font-semibold">Rp ${item.price.toLocaleString("id-ID")} / ${item.unit}</p>
                    </div>
                    <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                      <div class="h-full rounded-full ${item.status === "critical" ? "bg-red-500" : item.status === "low" ? "bg-orange-500" : "bg-emerald-500"}" style="width: ${stockPct}%"></div>
                    </div>
                  </div>
                </div>
              </div>
            `}).join('')}
          </div>
        `;
      }
      else if (tab === 'suppliers') {
        return `
          <div class="space-y-3">
            ${suppliers.map(s => `
              <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 scale-tap">
                <div class="flex items-start gap-3 mb-3">
                  <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                    <i data-lucide="package" class="w-6 h-6 text-blue-600"></i>
                  </div>
                  <div class="flex-1">
                    <p class="text-gray-900 text-sm font-semibold">${s.name}</p>
                    <p class="text-gray-500 text-xs">${s.category}</p>
                  </div>
                  <div class="flex items-center gap-1">
                    <span class="text-yellow-500 text-sm">★</span>
                    <span class="text-gray-700 text-xs font-semibold">${s.rating}</span>
                  </div>
                </div>
                <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                  <div class="flex-1">
                    <p class="text-gray-400 text-xs">Item disuplai</p>
                    <p class="text-gray-800 text-sm font-semibold">${s.items} produk</p>
                  </div>
                  <div class="flex-1">
                    <p class="text-gray-400 text-xs">Kontak</p>
                    <p class="text-gray-800 text-sm font-semibold">${s.contact}</p>
                  </div>
                  <button data-supplier="${s.name}" class="orderSupplierBtn px-3 py-2 bg-emerald-500 text-white rounded-xl text-xs font-semibold scale-tap">Order</button>
                </div>
              </div>
            `).join('')}

            <button class="w-full bg-white rounded-2xl p-5 border-2 border-dashed border-gray-200 flex items-center justify-center gap-3 text-gray-500 scale-tap">
              <i data-lucide="plus" class="w-5 h-5"></i>
              <span class="text-sm font-medium">Tambah Supplier Baru</span>
            </button>
          </div>
        `;
      }
      else { // ai tab
        return `
          <!-- AI Banner -->
          <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-3xl p-5 mb-4">
            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="zap" class="w-5 h-5 text-yellow-300"></i>
              <p class="text-white text-sm font-bold">AI Supply Manager</p>
            </div>
            <p class="text-indigo-200 text-xs">Analisis cerdas berbasis data transaksi dan tren penjualanmu untuk rekomendasi restok optimal</p>
          </div>

          <p class="text-gray-500 text-xs mb-3 px-1 font-semibold">REKOMENDASI RESTOK SEGERA</p>
          <div class="space-y-3 mb-6">
            ${aiRecommendations.map(rec => `
              <div class="bg-white rounded-2xl p-4 shadow-sm border ${rec.urgency === 'critical' ? 'border-red-200' : 'border-orange-200'} scale-tap">
                <div class="flex items-start gap-3 mb-3">
                  <div class="w-10 h-10 rounded-xl flex items-center justify-center ${rec.urgency === 'critical' ? 'bg-red-100' : 'bg-orange-100'}">
                    ${rec.urgency === 'critical' 
                      ? '<i data-lucide="alert-triangle" class="w-5 h-5 text-red-600"></i>' 
                      : '<i data-lucide="trending-down" class="w-5 h-5 text-orange-600"></i>'}
                  </div>
                  <div class="flex-1">
                    <div class="flex items-center gap-2 mb-0.5">
                      <p class="text-gray-900 text-sm font-semibold">${rec.item}</p>
                      <div class="px-2 py-0.5 rounded-full text-xs font-semibold ${rec.urgency === 'critical' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}">
                        ${rec.urgency === 'critical' ? '🚨 Kritis' : '⚠️ Segera'}
                      </div>
                    </div>
                    <p class="text-gray-500 text-xs">${rec.reason}</p>
                  </div>
                </div>
                <div class="flex items-center gap-2 p-3 bg-gray-50 rounded-xl mb-3">
                  <div class="flex-1">
                    <p class="text-gray-400 text-xs">Saran order</p>
                    <p class="text-gray-900 text-sm font-bold">${rec.suggestQty} ${rec.unit}</p>
                  </div>
                  <div class="flex-1">
                    <p class="text-gray-400 text-xs">Estimasi biaya</p>
                    <p class="text-gray-900 text-sm font-bold">Rp ${rec.estimatedCost.toLocaleString("id-ID")}</p>
                  </div>
                </div>
                <button data-rec="${rec.item}" class="autoOrderBtn w-full py-3 bg-emerald-500 text-white rounded-xl flex items-center justify-center gap-2 text-sm font-bold scale-tap">
                  <i data-lucide="shopping-cart" class="w-4 h-4"></i> Buat Order Otomatis
                </button>
              </div>
            `).join('')}
          </div>

          <!-- All good -->
          <div class="bg-emerald-50 rounded-2xl p-4 border border-emerald-200 flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center">
              <i data-lucide="check" class="w-5 h-5 text-white"></i>
            </div>
            <div>
              <p class="text-emerald-900 text-sm font-semibold">3 item lainnya aman</p>
              <p class="text-emerald-700 text-xs">Stok mencukupi untuk 7-14 hari ke depan</p>
            </div>
          </div>
        `;
      }
    }

    // attach all event listeners
    function attachEvents() {
      // back button
      const backBtn = document.getElementById('backButton');
      if (backBtn) backBtn.addEventListener('click', () => { showToast('Kembali ke beranda (simulasi)'); });

      // add item button (open modal)
      const addBtn = document.getElementById('addItemButton');
      if (addBtn) addBtn.addEventListener('click', () => { state.showAddItem = true; render(); });

      // close modal
      const closeModal = document.getElementById('closeModalBtn');
      if (closeModal) closeModal.addEventListener('click', () => { state.showAddItem = false; render(); });
      const saveItem = document.getElementById('saveItemBtn');
      if (saveItem) saveItem.addEventListener('click', () => { 
        state.showAddItem = false; 
        showToast('Barang berhasil ditambahkan!'); 
        render(); 
      });

      // overlay click close (if click outside sheet, but we use inner overlay, but we can add to overlay itself)
      const overlay = document.getElementById('modalOverlay');
      if (overlay) overlay.addEventListener('click', (e) => { if (e.target === overlay) { state.showAddItem = false; render(); } });

      // search input
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => { state.search = e.target.value; render(); });
      }

      // tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const tab = e.target.getAttribute('data-tab');
          if (tab) { state.activeTab = tab; state.search = ''; render(); }
        });
      });

      // go to ai tab from alert
      const gotoAi = document.getElementById('gotoAiTab');
      if (gotoAi) gotoAi.addEventListener('click', () => { state.activeTab = 'ai'; render(); });

      // order supplier buttons
      document.querySelectorAll('.orderSupplierBtn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const name = btn.getAttribute('data-supplier');
          showToast(`Menghubungi ${name}...`);
        });
      });

      // auto order ai buttons
      document.querySelectorAll('.autoOrderBtn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const item = btn.getAttribute('data-rec');
          showToast(`Order ${item} dibuat dan transaksi dicatat otomatis!`);
        });
      });
    }

    // initial render
    render();

    // re-render on any state mutation (modal, etc) — already inside events
    // to keep reactivity we manually call render. (simple)
    // but need to preserve listeners, attachEvents after each render.
  })();
</script>
</body>
</html>
