<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Boothera - Setup Profil Usaha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; background: #F0FDF4; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        .animate-scaleIn { animation: scaleIn 0.3s ease-out forwards; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #D1D5DB; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #10B981; border-radius: 10px; }
        
        .card-hover {
            transition: all 0.2s ease;
        }
        .card-hover:active {
            transform: scale(0.98);
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
    </style>
</head>
<body class="bg-[#F0FDF4]">

    <!-- Main Container -->
    <div class="max-w-[428px] mx-auto bg-white min-h-screen shadow-xl relative">
        
        <!-- ============================================ -->
        <!-- SETUP PROFIL SECTION -->
        <!-- ============================================ -->
        <div id="setupSection" class="min-h-screen flex items-center justify-center p-4 bg-white">
            <div class="max-w-md w-full animate-fadeIn">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-2xl mb-4">
                        <i class="fas fa-store text-green-600 text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold">Setup Profil Usaha</h2>
                    <p class="text-gray-500 mt-1">Isi data bisnis Anda</p>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-lg border border-gray-100 space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nama Usaha</label>
                        <input type="text" id="businessName" placeholder="Contoh: Kopi Kenangan" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Jenis Usaha</label>
                        <select id="businessType" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option>Kopi & Minuman</option>
                            <option>Makanan Ringan</option>
                            <option>Makanan Berat</option>
                            <option>Dessert</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Skala Usaha</label>
                        <div class="grid grid-cols-3 gap-3">
                            <button class="scale-btn py-3 rounded-xl border-2 border-gray-200 font-medium transition-all hover:border-green-400" data-scale="starter">Starter</button>
                            <button class="scale-btn py-3 rounded-xl border-2 border-gray-200 font-medium transition-all hover:border-green-400" data-scale="growing">Growing</button>
                            <button class="scale-btn py-3 rounded-xl border-2 border-gray-200 font-medium transition-all hover:border-green-400" data-scale="brand">Brand</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Lokasi Target</label>
                        <select id="targetLocation" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option>Jakarta Pusat</option>
                            <option>Jakarta Selatan</option>
                            <option>Jakarta Barat</option>
                            <option>Jakarta Timur</option>
                            <option>Jakarta Utara</option>
                            <option>Tangerang</option>
                            <option>Bekasi</option>
                            <option>Depok</option>
                        </select>
                    </div>

                    <button onclick="saveAndContinue()" class="w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white font-semibold py-4 rounded-2xl hover-lift mt-4">
                        Mulai Sekarang
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="fixed bottom-24 left-4 right-4 max-w-[428px] mx-auto bg-gray-800 text-white rounded-xl p-3 z-[1000] hidden animate-fadeIn">
            <div class="flex items-center gap-2"><i class="fas fa-check-circle text-green-400"></i><span id="toastMessage" class="text-sm"></span></div>
        </div>
    </div>

    <script>
        // ============================================
        // SCALE BUTTON HANDLER
        // ============================================
        let selectedScale = null;
        
        document.querySelectorAll('.scale-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.scale-btn').forEach(b => { 
                    b.classList.remove('border-green-500', 'bg-green-50'); 
                    b.classList.add('border-gray-200'); 
                });
                btn.classList.remove('border-gray-200'); 
                btn.classList.add('border-green-500', 'bg-green-50');
                selectedScale = btn.getAttribute('data-scale');
            });
        });

        // ============================================
        // SAVE AND CONTINUE
        // ============================================
        function saveAndContinue() {
            const businessName = document.getElementById('businessName').value;
            const businessType = document.getElementById('businessType').value;
            const targetLocation = document.getElementById('targetLocation').value;
            
            // Validasi
            if (!businessName) {
                showToast('Masukkan nama usaha Anda');
                return;
            }
            if (!selectedScale) {
                showToast('Pilih skala usaha Anda');
                return;
            }
            
            // Simpan ke localStorage
            const userProfile = {
                businessName: businessName,
                businessType: businessType,
                scale: selectedScale,
                targetLocation: targetLocation,
                completedAt: new Date().toISOString()
            };
            localStorage.setItem('boothera_user_profile', JSON.stringify(userProfile));
            localStorage.setItem('boothera_onboarding', 'true');
            
            showToast('Profil berhasil disimpan!');
            
            // Redirect ke halaman utama
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
        
        // ============================================
        // TOAST FUNCTION
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2000);
        }
    </script>
</body>
</html>
